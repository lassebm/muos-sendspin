# Loaded after /etc/asound.conf in place of ALSA's full configuration (see src/platform/alsa.h).
# The only definition we need from alsa.conf: control devices by card, which ALSA's device list
# opens. Without it, every listing logs "Invalid CTL hw:0".
ctl.hw {
	@args [ CARD ]
	@args.CARD { type string }
	type hw
	card $CARD
}
